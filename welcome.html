<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Bienvenido a ANDERGO Premium</title>
    <style>
      :root { color-scheme: light; font-family: Inter, system-ui, sans-serif; color: #111a33; background: #eef5ff; }
      * { box-sizing: border-box; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; background: radial-gradient(circle at 85% 15%, #c7f4ff, transparent 35%), linear-gradient(145deg, #eef4ff, #f9fbff); }
      main { width: min(620px, 100%); padding: clamp(28px, 6vw, 56px); text-align: center; background: #fff; border: 1px solid #cfe0ff; border-radius: 30px; box-shadow: 0 24px 70px rgba(39, 86, 165, .16); }
      .mark { width: 72px; height: 72px; margin: 0 auto 20px; display: grid; place-items: center; border-radius: 24px; color: #fff; font-size: 34px; background: linear-gradient(135deg, #2468ed, #08bce9); }
      h1 { margin: 0 0 12px; font-size: clamp(2rem, 7vw, 3.4rem); line-height: 1; }
      p { margin: 0 auto 28px; max-width: 480px; color: #62718d; font-size: 1.05rem; line-height: 1.65; }
      a { display: inline-flex; min-height: 52px; align-items: center; justify-content: center; padding: 0 28px; border-radius: 16px; color: #fff; font-weight: 800; text-decoration: none; background: linear-gradient(100deg, #2468ed, #06bce9); box-shadow: 0 12px 28px rgba(31, 111, 235, .24); }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">✓</div>
      <h1>¡Bienvenido!</h1>
      <p>Tu pago fue completado. Paddle está confirmando la suscripción y tu acceso se actualizará automáticamente.</p>
      <a href="/#learn">Comenzar a aprender →</a>
    </main>
  </body>
</html>
